<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000"><title>Sony Smart Clock</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}.p{height:76%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.l{width:50%;padding-left:3vw;padding-right:1vw}.r{width:50%;padding-left:4vw;text-align:center}
#time{font-size:25vw;line-height:.82;font-weight:300;letter-spacing:-.065em;white-space:nowrap;transform:translateX(1.5vw)}#ampm{font-size:.20em;font-weight:600;letter-spacing:.02em;margin-left:.12em}#date{margin-top:5vh;font-size:3.8vw;font-weight:600;letter-spacing:.06em;opacity:.78;white-space:nowrap;transform:translateX(1.5vw)}
.w{display:flex;align-items:center;justify-content:center;gap:1.8vw;white-space:nowrap}#icon{font-size:8.5vw}#temp{font-size:15.5vw;line-height:.85;font-weight:300}
#desc{margin-top:3.5vh;font-size:4.2vw;font-weight:700;white-space:nowrap}#place{margin-top:2.5vh;font-size:3.2vw;opacity:.78}#range{margin-top:1.6vh;font-size:2.8vw;opacity:.62}
#status{position:fixed;bottom:3px;left:0;right:0;text-align:center;font-size:9px;opacity:.25}
</style></head><body><div id="s"><div class="p l"><div id="time">--:--</div><div id="date">---</div></div><div class="p r"><div class="w"><div id="icon">🌤️</div><div id="temp">--°</div></div><div id="desc">GETTING WEATHER…</div><div id="place">Mount Waverley</div><div id="range">H --° · L --°</div></div></div><div id="status"></div><script>
function pad(n){return n<10?"0"+n:""+n}function clock(){var d=new Date(),ds=["SUN","MON","TUE","WED","THU","FRI","SAT"],ms=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];var hr=d.getHours(),ap=hr>=12?"PM":"AM";hr=hr%12;if(hr===0)hr=12;document.getElementById("time").innerHTML=hr+":"+pad(d.getMinutes())+'<span id="ampm"> '+ap+"</span>";document.getElementById("date").innerHTML=ds[d.getDay()]+" &middot; "+d.getDate()+" "+ms[d.getMonth()]}clock();setInterval(clock,1000);
var wx={0:["☀️","CLEAR"],1:["🌤️","MAINLY CLEAR"],2:["⛅","PARTLY CLOUDY"],3:["☁️","OVERCAST"],45:["🌫️","FOG"],48:["🌫️","FOG"],51:["🌦️","LIGHT DRIZZLE"],53:["🌦️","DRIZZLE"],55:["🌧️","HEAVY DRIZZLE"],61:["🌦️","LIGHT RAIN"],63:["🌧️","RAIN"],65:["🌧️","HEAVY RAIN"],71:["🌨️","LIGHT SNOW"],73:["🌨️","SNOW"],75:["❄️","HEAVY SNOW"],80:["🌦️","RAIN SHOWERS"],81:["🌧️","RAIN SHOWERS"],82:["⛈️","HEAVY SHOWERS"],95:["⛈️","THUNDERSTORM"],96:["⛈️","THUNDERSTORM"],99:["⛈️","THUNDERSTORM"]};
function render(x,o){var i=wx[x.current_weather.weathercode]||["🌡️","WEATHER"];document.getElementById("icon").innerHTML=i[0];document.getElementById("temp").innerHTML=Math.round(x.current_weather.temperature)+"°";document.getElementById("desc").innerHTML=i[1];document.getElementById("range").innerHTML="H "+Math.round(x.daily.temperature_2m_max[0])+"° &middot; L "+Math.round(x.daily.temperature_2m_min[0])+"°";document.getElementById("status").innerHTML=o?"OFFLINE · LAST SAVED WEATHER":""}
function fallback(){try{var s=localStorage.getItem("sonywx");if(s)render(JSON.parse(s),true)}catch(e){}}
function weather(){var u="https://api.open-meteo.com/v1/forecast?latitude=-37.88&longitude=145.13&current_weather=true&daily=temperature_2m_max%2Ctemperature_2m_min&timezone=Australia%2FMelbourne&forecast_days=1",r=new XMLHttpRequest();r.open("GET",u,true);r.onreadystatechange=function(){if(r.readyState===4){if(r.status>=200&&r.status<300){try{render(JSON.parse(r.responseText),false);localStorage.setItem("sonywx",r.responseText)}catch(e){fallback()}}else fallback()}};r.onerror=fallback;try{r.send(null)}catch(e){fallback()}}weather();setInterval(weather,900000);
</script></body></html>
